name: Build and Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: easycare-service
  DOCKER_REGISTRY: docker.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload docker-compose.yml to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          source: "deployment/docker-compose.yml"
          target: "/opt/easycare"

      - name: Deploy to remote server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          timeout: 120s
          command_timeout: 30m
          debug: true
          script: |
            set -euxo pipefail

            if [ ! -d "/opt/easycare" ]; then
              mkdir -p /opt/easycare
            fi
            cd /opt/easycare

            if [ ! -f "docker-compose.yml" ] && [ -f "deployment/docker-compose.yml" ]; then
              cp deployment/docker-compose.yml docker-compose.yml
            fi

            if [ ! -f "docker-compose.yml" ] && [ -f "deployment/docker-compose.yaml" ]; then
              cp deployment/docker-compose.yaml docker-compose.yaml
            fi

            if [ ! -f "docker-compose.yml" ] && [ ! -f "docker-compose.yaml" ]; then
              echo "docker-compose.yml/docker-compose.yaml not found under /opt/easycare" >&2
              ls -la
              exit 1
            fi

            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            elif docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              echo "Neither docker-compose nor docker compose is available on remote server" >&2
              exit 1
            fi

            trap 'echo "---- DEPLOY FAILED: dumping diagnostics ----"; docker ps -a || true; $COMPOSE ps || true; $COMPOSE logs --no-color --tail=200 || true; echo "---- END DIAGNOSTICS ----"' ERR

            docker version
            $COMPOSE version || true
            $COMPOSE config

            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest

            $COMPOSE down --remove-orphans

            $COMPOSE up -d --remove-orphans

            docker image prune -f

            $COMPOSE ps

            $COMPOSE logs --no-color --tail=200

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          timeout: 120s
          command_timeout: 10m
          debug: true
          script: |
            # 等待应用启动
            sleep 10
            
            # 健康检查
            curl -f http://localhost:8080/health/alive || exit 1
            echo "Application is healthy!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
