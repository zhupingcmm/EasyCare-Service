name: Build and Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: easycare-service
  DOCKER_REGISTRY: docker.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload docker-compose.yml to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          source: "deployment/docker-compose.yml"
          target: "/opt/easycare"

      - name: Deploy to remote server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          timeout: 120s
          command_timeout: 30m
          debug: true
          script: |
            set -euxo pipefail

            if [ ! -d "/opt/easycare" ]; then
              mkdir -p /opt/easycare
            fi
            cd /opt/easycare

            if [ -f "deployment/docker-compose.yml" ]; then
              cp -f deployment/docker-compose.yml docker-compose.yml
            fi

            if [ -f "deployment/docker-compose.yaml" ]; then
              cp -f deployment/docker-compose.yaml docker-compose.yaml
            fi

            if [ ! -f "docker-compose.yml" ] && [ ! -f "docker-compose.yaml" ]; then
              echo "docker-compose.yml/docker-compose.yaml not found under /opt/easycare" >&2
              ls -la
              exit 1
            fi

            set +x
            ACR_REGISTRY_VAL="${{ secrets.ACR_REGISTRY }}"
            ACR_NAMESPACE_VAL="${{ secrets.ACR_NAMESPACE }}"
            ACR_USERNAME_VAL="${{ secrets.ACR_USERNAME }}"
            ACR_PASSWORD_VAL="${{ secrets.ACR_PASSWORD }}"
            DB_URL_VAL="${{ secrets.DB_URL }}"
            DB_USERNAME_VAL="${{ secrets.DB_USERNAME }}"
            DB_PASSWORD_VAL="${{ secrets.DB_PASSWORD }}"

            if [ -z "$ACR_REGISTRY_VAL" ] || [ -z "$ACR_NAMESPACE_VAL" ] || [ -z "$ACR_USERNAME_VAL" ] || [ -z "$ACR_PASSWORD_VAL" ] || [ -z "$DB_URL_VAL" ] || [ -z "$DB_USERNAME_VAL" ] || [ -z "$DB_PASSWORD_VAL" ]; then
              echo "Missing required env values. Configure GitHub secrets: ACR_REGISTRY, ACR_NAMESPACE, ACR_USERNAME, ACR_PASSWORD, DB_URL, DB_USERNAME, DB_PASSWORD" >&2
              exit 1
            fi

            touch .env
            upsert_env() {
              key="$1"
              val="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                printf "%s=%s\n" "$key" "$val" >> .env
              fi
            }

            upsert_env "ACR_REGISTRY" "$ACR_REGISTRY_VAL"
            upsert_env "ACR_NAMESPACE" "$ACR_NAMESPACE_VAL"
            upsert_env "ACR_USERNAME" "$ACR_USERNAME_VAL"
            upsert_env "ACR_PASSWORD" "$ACR_PASSWORD_VAL"
            upsert_env "DB_URL" "$DB_URL_VAL"
            upsert_env "DB_USERNAME" "$DB_USERNAME_VAL"
            upsert_env "DB_PASSWORD" "$DB_PASSWORD_VAL"
            set -x

            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            elif docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              echo "Neither docker-compose nor docker compose is available on remote server" >&2
              exit 1
            fi

            trap 'echo "---- DEPLOY FAILED: dumping diagnostics ----"; docker ps -a || true; $COMPOSE ps || true; $COMPOSE logs --no-color --tail=200 || true; echo "---- END DIAGNOSTICS ----"' ERR

            docker version
            $COMPOSE version || true
            $COMPOSE config

            set +x
            ACR_REGISTRY_VAL="${{ secrets.ACR_REGISTRY }}"
            ACR_USERNAME_VAL="${{ secrets.ACR_USERNAME }}"
            ACR_PASSWORD_VAL="${{ secrets.ACR_PASSWORD }}"
            if [ -z "$ACR_REGISTRY_VAL" ] || [ -z "$ACR_USERNAME_VAL" ] || [ -z "$ACR_PASSWORD_VAL" ]; then
              echo "Missing ACR secrets for remote docker login: ACR_REGISTRY, ACR_USERNAME, ACR_PASSWORD" >&2
              exit 1
            fi
            printf '%s' "$ACR_PASSWORD_VAL" | docker login "$ACR_REGISTRY_VAL" -u "$ACR_USERNAME_VAL" --password-stdin
            set -x

            IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
            for i in 1 2 3 4 5; do
              if docker pull "$IMAGE"; then
                break
              fi
              if [ "$i" -eq 5 ]; then
                exit 1
              fi
              sleep $((i * 10))
            done

            $COMPOSE down --remove-orphans

            $COMPOSE up -d --remove-orphans

            docker image prune -f

            $COMPOSE ps

            $COMPOSE logs --no-color --tail=200

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          timeout: 120s
          command_timeout: 10m
          debug: true
          script: |
            set -euxo pipefail

            cd /opt/easycare

            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            elif docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              echo "Neither docker-compose nor docker compose is available on remote server" >&2
              exit 1
            fi

            for i in $(seq 1 30); do
              if curl -f http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "Application is healthy!"
                $COMPOSE logs --no-color --tail=200 || true
                exit 0
              fi
              if [ "$i" -eq 1 ] || [ "$i" -eq 10 ] || [ "$i" -eq 20 ] || [ "$i" -eq 30 ]; then
                echo "Waiting for application to become healthy (attempt ${i}/30)..." >&2
                $COMPOSE ps || true
                $COMPOSE logs --no-color --tail=200 || true
              fi
              sleep 5
            done

            echo "Healthcheck failed, dumping diagnostics..." >&2
            docker ps -a || true
            $COMPOSE ps || true
            $COMPOSE logs --no-color --tail=300 || true
            exit 1

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
