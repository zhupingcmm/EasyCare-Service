name: Build & Deploy Spring Boot App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ms-hr-maternity-env-config
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy source code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "src/,pom.xml,Dockerfile,.mvn/,mvnw,mvnw.cmd"
          target: "/tmp/ms-hr-maternity/"
          
      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /tmp/ms-hr-maternity
            
            # Maven 构建
            echo "Building with Maven..."
            # 确保使用服务器上的 Maven 配置
            source ~/.bashrc || true
            source ~/.profile || true
            
            # 检查 Java 版本
            echo "Java version:"
            java -version
            echo "JAVA_HOME: $JAVA_HOME"
            
            # 设置 Maven 路径
            MAVEN_HOME=/data/apache-maven-3.8.4
            export PATH=$MAVEN_HOME/bin:$PATH
            
            # 检查 Maven 版本
            echo "Maven version:"
            $MAVEN_HOME/bin/mvn -version
            
            # 使用服务器 Maven 配置文件
            if [ -f /data/apache-maven-3.8.4/conf/settings.xml ]; then
                echo "Using Maven settings from /data/apache-maven-3.8.4/conf/settings.xml"
                $MAVEN_HOME/bin/mvn clean package -DskipTests -B -s /data/apache-maven-3.8.4/conf/settings.xml
            elif [ -f /usr/local/maven/conf/settings.xml ]; then
                echo "Using Maven settings from /usr/local/maven/conf/settings.xml"
                $MAVEN_HOME/bin/mvn clean package -DskipTests -B -s /usr/local/maven/conf/settings.xml
            else
                echo "Using default Maven settings"
                $MAVEN_HOME/bin/mvn clean package -DskipTests -B
            fi
            
            # 检查 Maven 构建结果
            if [ $? -ne 0 ]; then
                echo "Maven build failed!"
                exit 1
            fi
            
            # 验证 JAR 文件是否生成
            if [ ! -d "target" ]; then
                echo "Target directory not found!"
                exit 1
            fi
            
            JAR_FILE=$(find target -name "*.jar" -type f | head -1)
            if [ -z "$JAR_FILE" ]; then
                echo "No JAR file found in target directory!"
                ls -la target/
                exit 1
            else
                echo "JAR file found: $JAR_FILE"
                ls -la target/
            fi
            
            # 停止并删除旧容器
            docker stop ms-hr-maternity || true
            docker rm ms-hr-maternity || true
            
            # 删除旧镜像（可选，节省空间）
            docker rmi ms-hr-maternity:latest || true
            
            # 在服务器本地构建新镜像
            echo "Building Docker image..."
            # 检查 Docker 配置（无需 sudo 权限）
            if [ -f /etc/docker/daemon.json ]; then
                echo "Docker daemon configuration found:"
                cat /etc/docker/daemon.json 2>/dev/null || echo "Cannot read Docker daemon config (permission denied)"
            else
                echo "No Docker daemon configuration file found at /etc/docker/daemon.json"
            fi
            
            # 构建镜像
            docker build -t ms-hr-maternity:latest .
            
            # 运行新容器
            echo "Starting new container..."
            docker run -d --name ms-hr-maternity -p 9016:8080 ms-hr-maternity:latest
            
            # 验证容器状态
            sleep 5
            docker ps | grep ms-hr-maternity
            
            # 清理临时文件
            rm -rf /tmp/ms-hr-maternity
            
