## DEV overrides only
spring.flyway.enabled=false


# Datasource URL
#spring.datasource.url=jdbc:postgresql://122.152.220.47:9020/windsurf?currentSchema=hr-maternity-cn-dev
spring.datasource.url=jdbc:postgresql://localhost:5432/iabc?currentSchema=easycare-dev
spring.datasource.username=postgres
spring.datasource.password=123456

# JPA debug (use logging framework instead of show-sql to avoid duplicate output)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging (more verbose in dev)
logging.level.com.hr.maternity=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# encryption
encryption.aes-secret-key=MySecretKey12345

# Login Mock Mode (enable in local for testing without RSA encryption)
login.mock.enabled=true

# email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.from=your-email@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
