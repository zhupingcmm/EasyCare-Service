## DEV overrides only

# Datasource URL
#spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/windsurf?currentSchema=hr-maternity-cn-dev
spring.datasource.url=jdbc:postgresql://8.153.38.116:5432/windsurf?currentSchema=hr-maternity-cn-dev

# JPA debug (use logging framework instead of show-sql to avoid duplicate output)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging (more verbose in dev)
logging.level.com.ocbc.ms.easy.care=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.from=your-email@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Development Tools
# Enable extract public key from private key endpoint (only for development)
app.dev.extract-key-enabled=true

# Login Mock Mode (enable in development for testing without RSA encryption)
login.mock.enabled=true
