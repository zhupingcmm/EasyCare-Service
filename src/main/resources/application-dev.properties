## DEV overrides only

# Datasource URL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/windsurf?currentSchema=hr-maternity-cn-dev
#spring.datasource.url=jdbc:postgresql://122.152.220.47:9020/windsurf?currentSchema=hr-maternity-cn-dev

# JPA debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging (more verbose in dev)
logging.level.com.hr.maternity=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.from=your-email@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Development Tools
# Enable extract public key from private key endpoint (only for development)
app.dev.extract-key-enabled=true
