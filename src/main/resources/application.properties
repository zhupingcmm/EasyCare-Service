# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Information
spring.application.name=maternity-calculator
spring.profiles.active=dev

# Database Configuration
spring.datasource.username=pzhu
spring.datasource.password=Admin_1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=hr-maternity-cn-dev

# Flyway Configuration (temporarily disabled due to database permissions)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.schemas=hr-maternity-cn-dev
spring.flyway.default-schema=hr-maternity-cn-dev

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Logging Configuration
logging.level.root=INFO
logging.level.com.ocbc.ms.easy.care=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# HTTP Client Configuration
spring.web.client.connect-timeout=5000
spring.web.client.read-timeout=10000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Management Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JSON Configuration
spring.jackson.default-property-inclusion=ALWAYS
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Shanghai

# Maternity Leave Configuration
maternity.default.lan-id=A5132253

management.health.mail.enabled=false
management.health.ldap.enabled=false

# Disable Spring Data LDAP repositories auto-configuration
spring.data.ldap.repositories.enabled=false

# JWT Configuration
jwt.secret=mySecretKey12345678901234567890123456789012
jwt.algorithm=RS256
jwt.issuer=HR
jwt.audience=OCBC
jwt.access-token.expiration=600
jwt.refresh-token.expiration=600

# Login LDAP switch (default false; enable in company network only)
login.ldap.enabled=false

# Login Mock switch (default false; when true, skip RSA decryption for testing)
login.mock.enabled=false

# Active Directory Configuration
ad.url=ldap://XXXXX.ZZ.COM:1222
ad.domain=GROUP
ad.search-base=DC=XXXXX,DC=ZZ,DC=COM
ad.username=
ad.password=
ad.org-unit=

# RSA Encryption Configuration
encryption.rsa-enabled=true
encryption.rsa-algorithm=RSA
encryption.rsa-transformation=RSA/ECB/OAEPPadding
encryption.rsa-padding=OAEP

# OAEP Parameters (must match frontend encryption)
# Frontend (Node-RSA): pkcs1_oaep (default) => Main Hash: SHA-1, MGF1 Hash: SHA-1 (default)
encryption.rsa-oaep-hash=SHA-1
encryption.rsa-oaep-mgf=MGF1
encryption.rsa-oaep-mgf-hash=SHA-1
encryption.nonce-expiration-minutes=5
encryption.nonce-byte-length=10
encryption.rsa-min-key-size=2048

# Nonce Cleanup Configuration
nonce.delete.threshold=1000
#nonce.delete.cron=0 0 2 * * ?
nonce.delete.cron=0 */1 * * * ?

# AES Encryption Secret Key
encryption.aes-secret-key=MySecretKey12345

# RSA Public Key (Hex format - for Node.js encrypt-server)
encryption.rsa-public-
encryption.rsa-public-exponent=010001

# RSA Private Key
encryption.rsa-private-key-pem=-----BEGIN PRIVATE KEY----------END PRIVATE KEY-----

# RSA Public Key
encryption.rsa-public-key-pem=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----

# User Role Assignment Configuration
user.role.hr-department=CHN E2P Human Resources

# Development Tools (disabled by default, enable in application-dev.properties)
app.dev.extract-key-enabled=true
